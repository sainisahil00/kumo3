name: Kumo3 Python CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================
  # STAGE 1: TEST
  # ==========================

  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-venv

      - name: Create Virtual Environment
        run: |
          python -m venv venv

      - name: Activate Environment and Install Dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall -q .

      # ==========================
      # STAGE 2: BUILD
      # ==========================

  build:
    name: Build Python Application
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Build Package
        run: |
          tar --exclude=.git \
              --exclude=venv \
              --exclude=__pycache__ \
              --exclude=.pytest_cache \
              -czf kumo3-build.tar.gz .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumo3-build
          path: kumo3-build.tar.gz
          retention-days: 3

      # ==========================
      # STAGE 3: DEPLOY
      # ==========================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: kumo3-build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy Build to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
              kumo3-build.tar.gz \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/kumo3-build.tar.gz

      - name: Deploy Application to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          set -e

          echo "Updating Ubuntu..."
          sudo apt update

          echo "Installing Python and required packages..."
          sudo apt install -y python3 python3-pip python3-venv tar

          echo "Creating application directory..."
          sudo mkdir -p /var/www/kumo3
          sudo chown -R ubuntu:ubuntu /var/www/kumo3

          cd /var/www/kumo3

          echo "Extracting build..."
          tar -xzf /tmp/kumo3-build.tar.gz

          echo "Creating virtual environment..."
          python3 -m venv venv

          echo "Activating virtual environment..."
          source venv/bin/activate

          echo "Upgrading pip..."
          python -m pip install --upgrade pip

          echo "Installing Python requirements..."
          pip install -r requirements.txt

          echo "Deployment files:"
          ls -la

          echo "Deployment completed."

          EOF
