
name: Kumo Python CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # STAGE 1: TEST
  # ==========================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Project Structure
        run: |
          test -f app.py
          test -f requirements.txt
          test -d templates
          test -d static

          echo "Project structure verified"

      - name: Check Python Syntax
        run: |
          python -m compileall -q app.py

          echo "Python syntax verified"

      - name: Install Dependencies
        run: |
          python -m venv test-env

          source test-env/bin/activate

          pip install --upgrade pip

          pip install -r requirements.txt

          echo "Dependencies installed successfully"


  # ==========================================
  # STAGE 2: BUILD
  # ==========================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Application
        run: |

          mkdir -p build

          cp app.py build/

          cp requirements.txt build/

          cp -r templates build/

          cp -r static build/

          echo "Build completed"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumo-build
          path: build/
          retention-days: 1


  # ==========================================
  # STAGE 3: DEPLOY
  # ==========================================

  deploy:
    name: Deploy to Ubuntu EC2
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: kumo-build
          path: build/

      # ----------------------------------------
      # SSH CONFIGURATION
      # ----------------------------------------

      - name: Configure SSH
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

        run: |

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # ----------------------------------------
      # TRANSFER APPLICATION
      # ----------------------------------------

      - name: Transfer Application
        run: |

          tar -czf kumo.tar.gz -C build .

          scp kumo.tar.gz \
          ubuntu@${{ secrets.EC2_HOST }}:/tmp/kumo.tar.gz


      # ----------------------------------------
      # DEPLOY ON EC2
      # ----------------------------------------

      - name: Deploy Application
        run: |

          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "Starting Kumo deployment..."

            # 1. Install Python environment

            sudo apt-get update

            sudo apt-get install -y \
              python3 \
              python3-venv \
              python3-pip

            # 2. Create deployment directories

            sudo mkdir -p /var/www/kumo/releases

            sudo chown -R ubuntu:ubuntu /var/www/kumo

            # 3. Create release directory

            RELEASE_ID=$(date +%Y%m%d%H%M%S)

            RELEASE_DIR="/var/www/kumo/releases/$RELEASE_ID"

            mkdir -p "$RELEASE_DIR"

            # 4. Extract application

            tar -xzf /tmp/kumo.tar.gz -C "$RELEASE_DIR"

            # 5. Create Python virtual environment

            python3 -m venv "$RELEASE_DIR/venv"

            # 6. Install Python dependencies

            "$RELEASE_DIR/venv/bin/pip" install --upgrade pip

            "$RELEASE_DIR/venv/bin/pip" install \
              -r "$RELEASE_DIR/requirements.txt"

            # 7. Set permissions

            sudo chown -R ubuntu:ubuntu "$RELEASE_DIR"

            # 8. Create systemd service

            sudo tee /etc/systemd/system/kumo.service > /dev/null << 'SERVICE'

            [Unit]
            Description=Kumo Python Cloud Storage Application
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            WorkingDirectory=/var/www/kumo/current
            ExecStart=/var/www/kumo/current/venv/bin/python /var/www/kumo/current/app.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target

            SERVICE

            # 9. Save previous release for rollback

            PREVIOUS_RELEASE=$(readlink -f /var/www/kumo/current || true)

            # 10. Activate new release

            ln -sfn "$RELEASE_DIR" /var/www/kumo/current

            # 11. Reload systemd

            sudo systemctl daemon-reload

            # 12. Enable application service

            sudo systemctl enable kumo

            # 13. Restart application

            if ! sudo systemctl restart kumo; then

              echo "Deployment failed. Rolling back..."

              if [ -n "$PREVIOUS_RELEASE" ]; then

                ln -sfn "$PREVIOUS_RELEASE" /var/www/kumo/current

                sudo systemctl restart kumo

              fi

              exit 1

            fi

            # 14. Verify application service

            sleep 3

            sudo systemctl is-active --quiet kumo

            # 15. Cleanup temporary package

            rm -f /tmp/kumo.tar.gz

            # 16. Keep latest 3 releases

            cd /var/www/kumo/releases

            ls -1dt */ | tail -n +4 | xargs -r rm -rf

            echo "================================"

            echo "KUMO DEPLOYMENT SUCCESSFUL"

            echo "================================"

            sudo systemctl status kumo --no-pager

          EOF
