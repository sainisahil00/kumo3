```yaml
name: Kumo3 Python CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =================================
  # STAGE 1: TEST
  # =================================

  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Packages
        run: |
          sudo apt update
          sudo apt install -y python3-venv

      - name: Create Virtual Environment
        run: |
          python -m venv venv

      - name: Activate Environment and Install Requirements
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Code
        run: |
          source venv/bin/activate
          python -m compileall -q .

      - name: Check Dependencies
        run: |
          source venv/bin/activate
          pip check


  # =================================
  # STAGE 2: BUILD
  # =================================

  build:
    name: Build Python Application
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Build Directory
        run: |
          mkdir -p /tmp/kumo3-build

      - name: Create Deployment Package
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=venv \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=*.pyc \
            -czf /tmp/kumo3-build/kumo3-build.tar.gz \
            .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumo3-build
          path: /tmp/kumo3-build/kumo3-build.tar.gz
          retention-days: 3


  # =================================
  # STAGE 3: DEPLOY
  # =================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: kumo3-build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy Build to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
            kumo3-build.tar.gz \
            ubuntu@${{ secrets.EC2_HOST }}:/tmp/kumo3-build.tar.gz

      - name: Deploy Python Application
        run: |
          ssh -i ~/.ssh/ec2_key \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

          set -e

          echo "Starting Kumo3 Deployment"

          # 1. Update Ubuntu
          sudo apt update

          # 2. Install Python and required packages
          sudo apt install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            tar

          # 3. Create application directory
          sudo mkdir -p /var/www/kumo3

          sudo chown -R ubuntu:ubuntu /var/www/kumo3

          cd /var/www/kumo3

          # 4. Remove previous application files
          find . -mindepth 1 -maxdepth 1 \
            ! -name venv -exec rm -rf {} +

          # 5. Extract new deployment package
          tar -xzf /tmp/kumo3-build.tar.gz -C /var/www/kumo3

          # 6. Create Python virtual environment
          if [ ! -d venv ]; then
            python3 -m venv venv
          fi

          # 7. Activate virtual environment
          source venv/bin/activate

          # 8. Upgrade pip
          python -m pip install --upgrade pip

          # 9. Install requirements.txt
          echo "Installing Python requirements..."

          pip install -r requirements.txt

          # 10. Create systemd service
          sudo tee /etc/systemd/system/kumo3.service > /dev/null << 'SERVICE'
          [Unit]
          Description=Kumo3 Python Application
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/var/www/kumo3
          Environment="PATH=/var/www/kumo3/venv/bin"
          ExecStart=/var/www/kumo3/venv/bin/python /var/www/kumo3/app.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          # 11. Reload systemd
          sudo systemctl daemon-reload

          # 12. Enable service
          sudo systemctl enable kumo3

          # 13. Restart application
          sudo systemctl restart kumo3

          # 14. Verify service
          sudo systemctl is-active --quiet kumo3

          echo "Kumo3 Deployment Successful!"

          EOF
```
