name: Test, Build & Deploy to EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------- 1. TEST ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint (syntax errors / undefined names)
        run: |
          source venv/bin/activate
          flake8 . --exclude venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          source venv/bin/activate
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pytest -v
          else
            echo "No tests found - running smoke test on app.py"
            python -c "from app import app; c = app.test_client(); r = c.get('/'); print('GET / ->', r.status_code); assert r.status_code == 200"
          fi

  # ---------- 2. BUILD ----------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify app compiles
        run: python -m compileall -q .

      - name: Package build artifact
        run: |
          tar --exclude=venv --exclude=.git --exclude=__pycache__ \
              -czf app-build.tar.gz app.py requirements.txt static templates

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app-build.tar.gz
          retention-days: 7

  # ---------- 3. DEPLOY ----------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,REPO
          script_stop: true
          script: |
            set -e
            APP_DIR=/home/ubuntu/app

            # Install server packages
            sudo apt-get update -y
            sudo apt-get install -y apache2 git python3 python3-pip python3-venv
            sudo systemctl enable --now apache2

            # Clone or update repo
            if [ -d "$APP_DIR/.git" ]; then
              cd $APP_DIR
              git pull origin main
            else
              git clone https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git $APP_DIR
              cd $APP_DIR
            fi

            # venv inside project folder
            [ -d venv ] || python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Restart app
            pkill -f "python3 app.py" || true
            nohup python3 app.py > app.log 2>&1 &
            disown
            sleep 3
            echo "Deployed and started"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
