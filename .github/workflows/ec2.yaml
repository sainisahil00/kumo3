
name: Python Website - Test, Build, Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_DIR: /home/ubuntu/mywebsite
  APP_PORT: 5000

jobs:
  # ---------------------------------------------------------------- TEST
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          if ls tests/ test_*.py *_test.py >/dev/null 2>&1; then
            pytest
          else
            echo "No tests found, skipping"
          fi

  # --------------------------------------------------------------- BUILD
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the app compiles
        run: python -m compileall .

      - name: Package application
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='.github' --exclude='venv' \
              --exclude='__pycache__' --exclude='dist' \
              -czf dist/app.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/app.tar.gz

  # -------------------------------------------------------------- DEPLOY
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Copy package to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: app.tar.gz
          target: /home/ubuntu/

      - name: Install packages, configure nginx and run app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,APP_PORT
          script_stop: true
          script: |
            set -e

            # 1. Install system packages
            sudo apt-get update -y
            sudo apt-get install -y python3-venv python3-pip nginx

            # 2. Unpack the app
            mkdir -p $APP_DIR
            tar -xzf /home/ubuntu/app.tar.gz -C $APP_DIR
            rm -f /home/ubuntu/app.tar.gz
            cd $APP_DIR

            # 3. Configure nginx as reverse proxy (port 80 -> app port)
            sudo tee /etc/nginx/sites-available/mywebsite > /dev/null <<EOF
            server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:$APP_PORT;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            EOF
            sudo ln -sf /etc/nginx/sites-available/mywebsite /etc/nginx/sites-enabled/mywebsite
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            # 4. Create virtual env and install requirements (last install step)
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # 5. Stop old instance, then run the app
            pkill -f "python3 app.py" || true
            nohup python3 app.py > app.log 2>&1 &
            sleep 3
            echo "App started. Last log lines:"
            tail -n 10 app.log
