
name: Python Website - Test, Build, Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_DIR: /home/ubuntu/mywebsite
  APP_PORT: 5000

jobs:
  # ---------------------------------------------------------------- TEST
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          if ls tests/ test_*.py *_test.py >/dev/null 2>&1; then
            pytest
          else
            echo "No tests found, skipping"
          fi

  # --------------------------------------------------------------- BUILD
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the app compiles
        run: python -m compileall .

      - name: Package application
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='.github' --exclude='venv' \
              --exclude='__pycache__' --exclude='dist' \
              -czf dist/app.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/app.tar.gz

  # -------------------------------------------------------------- DEPLOY
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}          # EC2 public IP / DNS
          username: ${{ secrets.EC2_USER }}      # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}        # contents of your .pem file
          envs: GH_TOKEN,REPO
          script_stop: true
          script: |
            set -e

            APP_DIR=/home/ubuntu/app

            # 1. Install apache2, python venv, git
            sudo apt-get update -y
            sudo apt-get install -y apache2 git python3 python3-pip python3-venv
            sudo systemctl enable --now apache2

            # 2. Clone repo (or pull if it already exists)
            if [ -d "$APP_DIR/.git" ]; then
              cd $APP_DIR
              git pull origin main
            else
              git clone https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git $APP_DIR
              cd $APP_DIR
            fi

            # 3. Create venv inside the project folder
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # 4. Activate venv and install requirements
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # 5. Stop old process, start app.py
            pkill -f "python3 app.py" || true
            nohup python3 app.py > app.log 2>&1 &
            disown
            sleep 3
            echo "App started"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
