name: Kumo3 Python CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # STAGE 1 - TEST
  # =========================
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m compileall -q .

      - name: Test Dependencies
        run: |
          pip check


  # =========================
  # STAGE 2 - BUILD
  # =========================
  build:
    name: Build Python Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Build Package
        run: |
          mkdir -p /tmp/kumo3-build

          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=venv \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=*.pyc \
            -czf /tmp/kumo3-build/kumo3-build.tar.gz \
            .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumo3-build
          path: /tmp/kumo3-build/kumo3-build.tar.gz
          retention-days: 3


  # =========================
  # STAGE 3 - DEPLOY
  # =========================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: kumo3-build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy Build to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            kumo3-build.tar.gz \
            ubuntu@${{ secrets.EC2_HOST }}:/tmp/kumo3-build.tar.gz

      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

          set -e

          echo "=================================="
          echo "Starting Kumo3 Deployment"
          echo "=================================="

          # Update Ubuntu
          sudo apt update

          # Install required packages
          sudo apt install -y \
            python3 \
            python3-pip \
            python3-venv \
            tar

          # Create application directory
          sudo mkdir -p /var/www/kumo3
          sudo chown ubuntu:ubuntu /var/www/kumo3

          # Clean previous application files (preserve venv)
          find /var/www/kumo3 -mindepth 1 -maxdepth 1 \
            ! -name 'venv' -exec rm -rf {} +

          # Extract new build
          tar -xzf /tmp/kumo3-build.tar.gz \
            -C /var/www/kumo3

          # Enter application directory
          cd /var/www/kumo3

          # Create virtual environment if missing
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          # Activate virtual environment
          source venv/bin/activate

          # Upgrade pip
          python -m pip install --upgrade pip

          # Install application dependencies
          pip install -r requirements.txt

          # Create systemd service
          sudo tee /etc/systemd/system/kumo3.service > /dev/null << 'SERVICE'
          [Unit]
          Description=Kumo3 Python Web Application
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/var/www/kumo3
          Environment="PATH=/var/www/kumo3/venv/bin"
          ExecStart=/var/www/kumo3/venv/bin/python app.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          # Reload systemd
          sudo systemctl daemon-reload

          # Enable service at boot
          sudo systemctl enable kumo3

          # Restart application
          sudo systemctl restart kumo3

          # Check application status
          sudo systemctl status kumo3 --no-pager

          echo "=================================="
          echo "Kumo3 Deployment Successful"
          echo "=================================="

          EOF
