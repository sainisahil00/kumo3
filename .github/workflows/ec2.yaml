name: Test, Build & Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- TEST
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint (syntax errors and undefined names)
        run: |
          source .venv/bin/activate
          flake8 . --exclude .venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Compile check
        run: |
          source .venv/bin/activate
          python -m compileall -q app.py

      - name: Run tests (if a tests folder exists)
        run: |
          source .venv/bin/activate
          if [ -d tests ]; then pytest -v; else echo "No tests folder, skipping pytest"; fi

  # --------------------------------------------------------------- BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Verify the app installs cleanly
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package the app
        run: |
          tar -czf kumo-build.tar.gz \
            app.py requirements.txt README.md static templates

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumo-build
          path: kumo-build.tar.gz
          retention-days: 7

  # ------------------------------------------------------------- DEPLOY
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APP_DIR: kumo
          APP_PORT: "5000"   # change if app.py runs on another port
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}        # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}          # contents of your .pem file
          envs: GH_TOKEN,REPO,APP_DIR,APP_PORT
          script_stop: true
          script: |
            set -e

            # 1. Install system packages
            sudo apt update -y
            sudo apt install -y python3 python3-pip python3-venv git apache2

            # 2. Clone the repo (first time) or pull the latest code
            cd /home/ubuntu
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git $APP_DIR
            fi
            cd /home/ubuntu/$APP_DIR
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git
            git fetch origin main
            git reset --hard origin/main

            # 3. Create the virtual environment inside the project folder
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi

            # 4. Activate it and install requirements
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            deactivate

            # 5. Run app.py as a systemd service (keeps running after the SSH session ends)
            sudo tee /etc/systemd/system/kumo.service > /dev/null <<EOF
            [Unit]
            Description=Kumo Python App
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu/${APP_DIR}
            ExecStart=/home/ubuntu/${APP_DIR}/.venv/bin/python3 app.py
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable kumo
            sudo systemctl restart kumo

            # 6. Apache reverse proxy: port 80 -> app port
            sudo a2enmod proxy proxy_http
            sudo tee /etc/apache2/sites-available/kumo.conf > /dev/null <<EOF
            <VirtualHost *:80>
                ProxyPreserveHost On
                ProxyPass / http://127.0.0.1:${APP_PORT}/
                ProxyPassReverse / http://127.0.0.1:${APP_PORT}/
            </VirtualHost>
            EOF
            sudo a2dissite 000-default.conf || true
            sudo a2ensite kumo.conf
            sudo systemctl restart apache2

            # 7. Quick status check
            sudo systemctl --no-pager status kumo | head -n 15
